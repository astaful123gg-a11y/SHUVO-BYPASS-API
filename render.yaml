services:
  - type: web
    name: bypass-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 600
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BYPASS_TIMEOUT
        value: "300"
